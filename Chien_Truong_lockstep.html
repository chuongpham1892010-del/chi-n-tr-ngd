 case 'auto':{p.ai=!!c.on;if(pid===MY){AUTO=c.on?1:0;$('au').classList.toggle('on',!!AUTO);$('au').textContent=AUTO?'Tự động: BẬT':'Tự động';if(AUTO)p.t=0;toast(AUTO?'Máy đang chơi thay bạn. Bấm lại để tự điều khiển':'Bạn tự điều khiển lại')}return}
 }}
function execList(list){for(const e of list){EXEC=e.pid;for(const c of e.cmds){try{execCmd(e.pid,c)}catch(err){console.error(err)}}}EXEC=-1}

// ===== Vòng tick cố định =====
// Đồng hồ tick chạy trong Web Worker: không bị trình duyệt giảm tốc khi tab nền (rAF thì bị dừng).
const TICKER=(()=>{try{const w=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(1),25)'],{type:'text/javascript'})));w.onmessage=()=>{if(NET.on){netPump();runTicks(.025)}};return w}catch(e){return null}})();
// Nội suy hình ảnh: vẽ vị trí nằm giữa trạng thái tick trước và tick hiện tại, nên chuyển động mượt ở mọi khung hình
let IA=1,IS=null;
function interpOn(){IA=Math.max(0,Math.min(1,acc/DT));IS=[];for(const u of units){if(u._ox===undefined)continue;IS.push(u,u.x,u.y);u.x=u._ox+(u.x-u._ox)*IA;u.y=u._oy+(u.y-u._oy)*IA}}
function interpOff(){if(!IS)return;for(let i=0;i<IS.length;i+=3){IS[i].x=IS[i+1];IS[i].y=IS[i+2]}IS=null}
function canTick(){return !NET.on||(!NET.halt&&netReady(TK))}
function runTicks(dtr){
 if(!W||!players.length)return;
 const run=!over&&(NET.on||(!paused&&!menuOn));
 if(!run){acc=0;return}
 acc+=dtr*speed;let n=0;
 while(acc>=DT&&n<6){if(!canTick()){acc=Math.min(acc,DT);break}simTick();acc-=DT;n++;if(over){acc=0;break}}
 if(!NET.on&&Date.now()-lastSave>20000)saveGame('a');
}
function simTick(){
 if(dirty){territ();dirty=0}
 for(const u of units){u._ox=u.x;u._oy=u.y}
 execList(NET.on?netTake(TK):[{pid:MY,cmds:CMDQ.splice(0)}]);
 if(!over){upd(DT);fogUpd()}
 TK++;
 if(LIM&&!over&&TK>=LIM)timeUp();
 if(NET.on&&TK%20===0){const h=stateHash();netSend({type:'h',t:TK,hash:h});hashIn(TK,MY,h)}
}
function stateHash(){let h=2166136261|0;const F=new Float64Array(1),U=new Uint32Array(F.buffer);
 const mix=v=>{h=Math.imul(h^(v|0),16777619)};const mixF=v=>{F[0]=v;mix(U[0]);mix(U[1])};
 mix(TK);
 for(const u of units){mix(u.id);mixF(u.x);mixF(u.y);mixF(u.hp);mix(u.o)}
 for(const c of cities){mix(c.o);mixF(c.hp)}
 for(const p of players)mixF(p.res);
 return h>>>0}

// ===== Lớp mạng lockstep =====
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o))}
function netPutIn(t,p,c){if(!(p>=0&&p<NET.n)||t<TK)return;let a=NET.buf.get(t);if(!a){a=[];NET.buf.set(t,a)}if(a[p]===undefined)a[p]=c}
function netReady(t){const a=NET.buf.get(t);for(let p=0;p<NET.H;p++){if(NET.dropFrom[p]!==undefined&&t>=NET.dropFrom[p])continue;if(!a||a[p]===undefined)return false}return true}
function netTake(t){const a=NET.buf.get(t)||[];NET.buf.delete(t);const out=[];for(let p=0;p<NET.n;p++)if(a[p])out.push({pid:p,cmds:a[p]});return out}
function netPump(){if(!NET.on||!NET.started||!players.length||over)return;
 while(NET.nextSend<=TK+NET.D){const t=NET.nextSend,c=NET.pend.splice(0);netSend({type:'in',t,c});netPutIn(t,MY,c);NET.nextSend++}}
function hashIn(t,p,h){let a=NET.hs.get(t);if(!a){a=[];NET.hs.set(t,a)}if(a[p]!==undefined)return;a[p]=h;const ref=a[MY];if(ref===undefined)return;
 for(let q=0;q<NET.n;q++)if(a[q]!==undefined&&a[q]!==ref){desync(q);return}}
function desync(q){if(NET.halt)return;NET.halt=1;toast('Lệch đồng bộ với người chơi '+(q+1)+'. Ván đã dừng, hãy tải lại trang');console.error('desync pid',q)}
function netMapLoad(net){S0=net.S0;seed=net.seed;const bin=atob(net.terr);if(bin.length!==GW*GH)throw new Error('kich thuoc ban do khong khop');
 terr=new Uint8Array(GW*GH);cost=new Float32Array(GW*GH);for(let i=0;i<terr.length;i++){terr[i]=bin.charCodeAt(i);cost[i]=CTC[terr[i]]}tcv=net.canvas}
function netHostStart(){if(NET.count!==NET.H){toast('Chưa đủ người: '+NET.count+'/'+NET.H);return}
 NET.n=NET.total;MY=0;go(NET.n,null,{host:1,humans:NET.H});
 let bin='';for(let i=0;i<terr.length;i++)bin+=String.fromCharCode(terr[i]);
 netSend({type:'start',payload:{lim:LIM,n:NET.n,S0,seed:GENSEED,GW,GH,terr:btoa(bin),img:tcv.toDataURL('image/jpeg',.7)}});
 menuOn=0;$('ov').style.display='none';ui()}
async function netJoinStart(m){
 NET.pid=m.pid;NET.n=m.n;NET.H=m.humans;MY=m.pid;const p=m.payload,im=new Image();im.src=p.img;
 try{await im.decode()}catch(e){}
 const cc=document.createElement('canvas');cc.width=im.width||(p.GW*.5);cc.height=im.height||(p.GH*.5);cc.getContext('2d').drawImage(im,0,0);
 go(m.n,null,{host:0,lim:p.lim,humans:m.humans,S0:p.S0,seed:p.seed,terr:p.terr,canvas:cc});
 menuOn=0;$('ov').style.display='none';ui()}
function netOnMsg(m){
 if(m.type==='room'){NET.code=m.code;NET.pid=m.pid;NET.count=m.count;NET.total=m.total;NET.H=m.humans;if(!NET.started&&!players.length)netLobby();return}
 if(m.type==='start'){netJoinStart(m);return}
 if(m.type==='in'){if(Array.isArray(m.c))netPutIn(m.t,m.pid,m.c.slice(0,200));return}
 if(m.type==='h'){hashIn(m.t,m.pid,m.hash);return}
 if(m.type==='pong'){netRtt(m.t);return}
 if(m.type==='drop'){NET.dropFrom[m.pid]=m.last+1;toast('Một người chơi đã thoát khỏi ván')}
 if(m.type==='err'){toast(m.msg);if(!NET.started){NET.on=0;try{NET.ws.close()}catch(e){}NET.ws=null;showMenu('Chiến Trường',MENUTXT)}}
}
function netConnect(url,first){let ws;try{ws=new WebSocket(url)}catch(e){toast('Địa chỉ máy chủ không hợp lệ');return}
 NET.ws=ws;NET.on=1;NET.started=0;NET.halt=0;NET.buf=new Map();NET.hs=new Map();NET.dropFrom=[];NET.pend=[];NET.nextSend=0;
 ws.onopen=()=>{first();NET.pingT=setInterval(()=>netSend({type:'ping',t:performance.now()}),1000)};ws.onmessage=e=>{try{netOnMsg(JSON.parse(e.data))}catch(err){console.error(err)}};
 ws.onerror=()=>toast('Không kết nối được máy chủ');
 ws.onclose=()=>{clearInterval(NET.pingT);if(NET.started&&!over)toast('Mất kết nối máy chủ')}}
// Đo ping qua máy chủ; độ trễ lệnh tăng khi mạng xấu để gói tin đến kịp trước khi cần
function netRtt(t0){const r=performance.now()-t0;if(NET.rtt===undefined){NET.rtt=r;NET.dev=0}else{NET.dev=.8*NET.dev+.2*Math.abs(r-NET.rtt);NET.rtt=.8*NET.rtt+.2*r}NET.D=Math.max(3,Math.min(12,Math.ceil((NET.rtt/2+2*NET.dev+40)/(DT*1000/.3))))}
function netUrl(){let u=localStorage.getItem('ct_srv')||'ws://localhost:8080';u=prompt('Địa chỉ máy chủ (ws:// hoặc wss://)',u);if(!u)return null;u=u.trim();try{localStorage.setItem('ct_srv',u)}catch(e){}return u}
function netCreate(){const u=netUrl();if(!u)return;
 const N=parseInt(prompt('Tổng số người trong phòng (2 đến 5):','3'),10);if(!(N>=2&&N<=5)){toast('Số người phải từ 2 đến 5');return}
 const B=parseInt(prompt('Số máy (bot) trong phòng (0 đến '+(N-1)+'):','0'),10);if(!(B>=0&&B<=N-1)){toast('Số máy phải từ 0 đến '+(N-1));return}
 NET.total=N;NET.H=N-B;netConnect(u,()=>netSend({type:'create',total:N,bots:B}))}
function netJoin(){const u=netUrl();if(!u)return;const c=(prompt('Nhập mã phòng (4 ký tự)')||'').trim().toUpperCase();if(c)netConnect(u,()=>netSend({type:'join',code:c}))}
function netStatus(){if(!NET.on)return'';const parts=[];if(NET.rtt!==undefined)parts.push('Ping '+Math.round(NET.rtt)+' ms');
 if(NET.started&&!canTick()){const a=NET.buf.get(TK)||[],w=[];for(let p=0;p<NET.H;p++){if(NET.dropFrom[p]!==undefined&&TK>=NET.dropFrom[p])continue;if(a[p]===undefined)w.push('Người '+(p+1))}if(w.length)parts.push('Đang chờ '+w.join(', '))}
 return parts.length?'<small>'+parts.join(' · ')+'</small><br>':''}
function netLobby(){menuOn=1;$('ov').style.display='flex';$('ot').textContent='Phòng '+NET.code;
 $('od').textContent=`Mã phòng: ${NET.code}. Phòng ${NET.total} người: ${NET.H} người thật${NET.total-NET.H?' và '+(NET.total-NET.H)+' máy':''}. Đã vào ${NET.count}/${NET.H}.`+(NET.pid===0?(NET.count===NET.H?' Có thể bắt đầu.':' Chờ đủ người rồi bấm bắt đầu.'):' Đang chờ chủ phòng bắt đầu.');
 $('om').style.display='none';const ob=$('ob');ob.innerHTML='';
 if(NET.pid===0){const b=document.createElement('button');b.textContent='Bắt đầu ván';b.disabled=NET.count!==NET.H;b.onclick=netHostStart;ob.appendChild(b)}
 const l=document.createElement('button');l.textContent='Rời phòng';l.onclick=netLeave;ob.appendChild(l)}
function netLeave(){try{if(NET.ws)NET.ws.close()}catch(e){}location.reload()}

function toast(m){if(EXEC>=0&&EXEC!==MY)return;const t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
function getMeta(sl){try{return JSON.parse(localStorage.getItem(KEY+sl+'_i'))}catch(e){return null}}
function saveGame(sl,manual){if(NET.on){if(manual)toast('Không lưu được khi chơi online');return 0}if(!players.length||over||!W)return 0;
 try{const r=v=>Math.round(v*10)/10,r2=v=>Math.round(v*100)/100;
  const fgI=new Map(FG.map((g,i)=>[g,i])),ciI=new Map(cities.map((c,i)=>[c,i])),sv={v:1,L:LIM,k:TK,t:towers.map(t=>[r(t.x),r(t.y),r(t.hp),t.o]),s:S0,n:N,si,z:cam.z,cx:cam.x,cy:cam.y,p:players.map(p=>[r(p.res),p.ai?1:0,p.alive,r(p.w),r(p.t),r(p.lost),p.cm||0]),
   c:cities.map(c=>[c.x,c.y,c.o,c.cap?1:0,c.home,r(c.hp),c.q.slice(),r(c.pr),c.wl||0,c.so]),
   u:units.map(u=>[u.o,u.e,r(u.x),r(u.y),r(u.hp),r(u.mo),r(u.su),r(u.rt),u.fl,u.fm,r2(u.fx),r2(u.fy),u.lg||0,u.ord?[r(u.ord.tx),r(u.ord.ty),u.ord.c?ciI.get(u.ord.c):-1,r(u.ord.ox),r(u.ord.oy)]:0,u.fg?fgI.get(u.fg):-1,u.sl?u.sl[0]:0,u.sl?u.sl[1]:0]),
   g:FG.map(g=>[g.t,r(g.x),r(g.y),r2(g.fx),r2(g.fy),r(g.tx),r(g.ty),g.c?cities.indexOf(g.c):-1,g.D?1:0,r(g.sp)])};
  localStorage.setItem(KEY+sl,JSON.stringify(sv));localStorage.setItem(KEY+sl+'_i',JSON.stringify({n:N,t:Date.now()}));lastSave=Date.now();if(manual)toast('Đã lưu ván chơi');return 1}
 catch(e){lastSave=Date.now();if(manual)toast('Không lưu được (trình duyệt chặn bộ nhớ)');return 0}}
function loadGame(sl){let sv;try{sv=JSON.parse(localStorage.getItem(KEY+sl))}catch(e){}if(!sv||!sv.u){toast('Không tải được ván đã lưu');return}try{go(sv.n,sv)}catch(e){toast('Bản lưu bị lỗi');console.error(e)}}
function limRow(){return '<div style="display:flex;gap:6px;align-items:center"><small>Thời gian ván:</small>'+[[0,'Không giới hạn'],[30,'30 phút'],[60,'1 giờ']].map(([m,l])=>`<button class="${LIMM===m?'on':''}" style="min-width:0;flex:1;font-size:14px" onclick="setLimM(${m})">${l}</button>`).join('')+'</div>'}
function setLimM(m){LIMM=m;buildMenu()}
function score(i){let s=0;for(const c of cities)if(c.o===i)s+=c.cap?3:1;return s}
function fmtT(t){let s=Math.max(0,Math.ceil(t/30)),m=s/60|0;s%=60;return m+':'+(s<10?'0':'')+s}
function timeUp(){const sc=players.map((p,i)=>p.alive?score(i):0),best=Math.max(...sc),top=sc.map((s,i)=>s===best?i:-1).filter(i=>i>=0),nm=i=>i===MY?'Bạn':'Bot '+i;
 over=top.length>1?(top.includes(MY)?'Hòa':'Bạn đã thua'):(top[0]===MY?'Chiến thắng!':'Bạn đã thua');
 const d='Hết giờ! Số thành phố (thủ đô tính 3): '+sc.map((s,i)=>nm(i)+' '+s).join(' · ')+(top.length>1?'. Các bên dẫn đầu hòa điểm.':'.');
 const sl=over=='Chiến thắng!'?['a','m']:['a'];try{sl.forEach(k=>{localStorage.removeItem(KEY+k);localStorage.removeItem(KEY+k+'_i')})}catch(e){}
 showMenu(over,d)}
function buildMenu(){let h='';if(players.length&&!over)h+='<button onclick="resume()">Quay lại ván đang chơi</button>';
 [['m','Ván đã lưu'],['a','Tự động lưu']].forEach(([sl,l])=>{const m=getMeta(sl);if(m)h+=`<div style="display:flex;gap:6px"><button style="flex:1" onclick="loadGame('${sl}')">${l} · ${m.n} người · ${new Date(m.t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}</button><button id="dl_${sl}" style="min-width:0;font-size:14px" onclick="delSave('${sl}')">Xóa</button></div>`});
 if(!NET.on)h+=limRow();h+=NET.on?(players.length&&!over?'':'<button onclick="netLeave()">Thoát ván online</button>'):[2,3,4,5].map(n=>`<button onclick="go(${n})">Ván mới · ${n} người chơi</button>`).join('')+'<button onclick="netCreate()">Chơi online: tạo phòng</button><button onclick="netJoin()">Chơi online: vào phòng</button>';$('ob').innerHTML=h}
function delSave(sl){const b=$('dl_'+sl);if(!b)return;if(b.dataset.c){try{localStorage.removeItem(KEY+sl);localStorage.removeItem(KEY+sl+'_i')}catch(e){}buildMenu();toast('Đã xóa bản lưu');return}
 b.dataset.c=1;b.textContent='Chắc chắn?';b.style.outline='2px solid #f33';clearTimeout(delSave.h);delSave.h=setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent='Xóa';b.style.outline=''}},3000)}
function toggleMore(){const od=$('od'),b=$('om'),open=od.classList.toggle('expanded');b.textContent=open?'Thu gọn':'Xem thêm';if(open)od.scrollTop=0}

function selLg(k){const a=units.filter(u=>u.o===MY&&u.lg===k);if(!a.length){toast('Đ'+k+' chưa có quân');return}setSel(a);selCity=null;let x=0,y=0;a.forEach(u=>{x+=u.x;y+=u.y});cam.x=x/a.length-cv.clientWidth/2/cam.z;cam.y=y/a.length-cv.clientHeight/2/cam.z;clamp();ui()}
